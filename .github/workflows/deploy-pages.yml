name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build client
        env:
          # Repo subpath GitHub Pages serves this project from.
          BASE_PATH: /PocketArena/
          # Signaling server deployed separately on Render (see render.yaml).
          VITE_SIGNALING_URL: wss://pocket-arena-l6q9.onrender.com/ws
        run: npm run build
      - name: SPA fallback for deep links (e.g. /join/ABC123)
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
